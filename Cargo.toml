[package]
name = "pco_pack"
version = "0.1.0"
edition = "2024"
license = "MIT"
include = ["src/**/*.rs", "Cargo.toml", "README.md"]
description = "Zero-config columnar compression"
keywords = ["compression", "columnar", "timeseries"]
repository = "https://github.com/pganalyze/pco_store"

[workspace]
members = [".", "pco_pack_derive"]

[dependencies]
ahash = "0.8"
anyhow = "1.0"
bitvec = "1.0"
chrono = { version = "0.4", features = ["serde"] }
half = "2.7"
hex = "0.4"
pco = "1.0"
pco_pack_derive = { path = "pco_pack_derive" }
rmp-serde = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1.0"
smol_str = { version = "0.2", features = ["serde"] }
uuid = { version = "1.0", features = ["serde", "std"] }
zstd = "0.13"

[dev-dependencies]
bytemuck = "1.0"
columnar = { version = "0.13", features = ["serde", "std"] }
markdown-tables = "0.1"
serde_columnar = "0.3"

[[bench]]
name = "collection"
harness = false

[[bench]]
name = "chunk_size"
harness = false

[[bench]]
name = "filter"
harness = false

[[bench]]
name = "float_round"
harness = false

[[bench]]
name = "number"
harness = false

[[bench]]
name = "other"
harness = false

[[bench]]
name = "struct"
harness = false

[[bench]]
name = "time_round"
harness = false

[[bench]]
name = "timeline"
harness = false
