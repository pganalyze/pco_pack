[package]
name = "pco_pack"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Zero-config columnar compression"
keywords = ["compression", "columnar", "timeseries"]
repository = "https://github.com/pganalyze/pco_pack"
autobenches = false
exclude = ["src/test*.rs", "src/test/*", "tests/*.rs", "benches/*.rs", "examples/*"]

[workspace]
members = [".", "pco_pack_derive"]

# cargo bench must not run the libtest harness: it forwards every bench
# argument and rejects the suite's --crates flag. Unit tests still run via
# cargo test, and all real benchmarks are declared [[bench]] targets.
[lib]
bench = false

[dependencies]
ahash = "0.8"
anyhow = "1.0"
bitvec = "1.0"
chrono = { version = "0.4", features = ["serde"] }
half = { version = "2.7", features = ["serde"] }
hex = "0.4"
pco = "1.0"
pco_pack_derive = { version = "0.1.0", path = "pco_pack_derive" }
rmp-serde = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1.0"
smol_str = { version = "0.2", features = ["serde"] }
uuid = { version = "1.0", features = ["serde", "std"] }
zstd = "0.13"

[dev-dependencies]
arrow-array = "59"
arrow-schema = "59"
bytemuck = "1.0"
columnar = { version = "0.13", features = ["serde", "std"] }
flate2 = "1"
futures = "0.3"
markdown-tables = "0.1"
md-5 = "0.10"
osm-pbf = { version = "0.3", default-features = false, features = ["zlib"] }
osm-types = "0.1"
parquet = "59"
peak_alloc = "0.3"
serde_arrow = { version = "0.15", features = ["arrow-59"] }
serde_columnar = "0.3"
tokio = { version = "1", features = ["rt"] }
uuid = { version = "1.0", features = ["v4"] }
vortex = { version = "0.88", features = ["tokio"] }

[[bench]]
name = "datasets"
harness = false

[[bench]]
name = "postgres"
harness = false

[[bench]]
name = "synthetic"
harness = false
