[package]
name = "pco_pack_derive"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Derive macro for pco_pack"
repository = "https://github.com/pganalyze/pco_pack"
exclude = ["src/test*.rs", "src/test/*"]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full"] }

[dev-dependencies]
glob = "0.3"
prettyplease = "0.2"
